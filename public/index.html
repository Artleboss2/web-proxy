<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Web Proxy</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; background:#111; color:#eee; }
  form { display:flex; gap:.5rem; margin-bottom:1rem; }
  input { flex:1; padding:.6rem; border-radius:6px; border:1px solid #444; background:#1b1b1b; color:#eee; }
  button { padding:.6rem 1rem; border-radius:6px; border:none; background:#4f8cff; color:#fff; cursor:pointer; }
  iframe { width:100%; height:80vh; border:1px solid #333; border-radius:8px; background:#fff; }
</style>
</head>
<body>
  <!--
    Frontend servi par Vercel, meme domaine que /api/go : le cookie de
    session (pxs) est donc de premier parti, aucun blocage navigateur.
  -->
  <form id="f">
    <input id="url" type="text" placeholder="https://exemple.com" />
    <button type="submit">Ouvrir</button>
  </form>
  <iframe id="frame" title="proxy"></iframe>

  <script>
    const form = document.getElementById("f");
    const input = document.getElementById("url");
    const frame = document.getElementById("frame");

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      let url = input.value.trim();
      if (!/^https?:\/\//i.test(url)) url = "https://" + url;
      // Chemin relatif : pas besoin de connaitre le domaine Vercel.
      frame.src = "/api/go?url=" + encodeURIComponent(url);
    });
  </script>
</body>
</html>
